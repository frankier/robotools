name: Build frankier image

on:
  # Rebuild whenever the base image workflow finishes, so this image always
  # tracks the base image.
  workflow_run:
    workflows: ["Build base image"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "Dockerfile.frankier"
      - ".github/workflows/build-frankier-image.yml"
  pull_request:
    paths:
      - "Dockerfile.frankier"
      - ".github/workflows/build-frankier-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  DOCKERFILE: Dockerfile.frankier

jobs:
  build:
    # workflow_run also fires for failed base builds and for pull requests,
    # which never push a base image. Only rebuild on top of a base image that
    # was actually pushed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalise image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Select base image
        id: base
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The base workflow tags every pushed build with sha-<commit>, so a
          # base rebuild can be followed exactly. Other events (changes to this
          # Dockerfile) build on top of the current `latest` instead.
          if [ -n "$BASE_SHA" ]; then
            echo "ref=${IMAGE}:sha-${BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # The base image owns `latest` and the plain ref/sha tags, so this
          # image only publishes `frankier` and prefixed tags.
          tags: |
            type=raw,value=frankier,enable={{is_default_branch}}
            type=sha,prefix=frankier-sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          # Pull requests only verify that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See build-base-image.yml: provenance would turn the push into an
          # image index that Apptainer cannot resolve.
          provenance: false
          cache-from: type=gha,scope=frankier
          cache-to: type=gha,mode=max,scope=frankier
