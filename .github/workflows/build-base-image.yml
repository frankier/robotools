name: Build base image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.base.tmpl"
      - "render_dockerfile.py"
      - ".github/workflows/build-base-image.yml"
  pull_request:
    paths:
      - "Dockerfile.base.tmpl"
      - "render_dockerfile.py"
      - ".github/workflows/build-base-image.yml"
  schedule:
    # Monthly rebuild (1st of the month) so upstream Intel oneAPI updates get picked up.
    - cron: "0 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERFILE: Dockerfile.base

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalise image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Render Dockerfile from template
        run: uv run --script render_dockerfile.py --output "$DOCKERFILE"

      - name: Show rendered Dockerfile
        run: cat "$DOCKERFILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=schedule,pattern=monthly-{{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          # Pull requests only verify that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
